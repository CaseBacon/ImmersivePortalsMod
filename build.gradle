plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// Publishing to CurseForge/Modrinth/GitHub (mod-publish-plugin) was removed on the 26.3 branch
// so that development builds of this fork can never be uploaded to the original projects.

version = project.mod_version
group = project.maven_group


base {
    archivesName = project.archives_base_name
}

allprojects {
    repositories {
        mavenCentral()

        // cloth config
        maven { url = "https://maven.shedaniel.me/" }
        // mod menu
        maven { url = "https://maven.terraformersmc.com/releases/" }

        // sodium, iris, midnightlib
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
    }

    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            it.options.release = 25
            it.options.encoding = 'UTF-8'
            it.options.compilerArgs += ['-Xmaxerrs', '5000']
        }
    }
}

// dimlib must be configured before its source set is referenced below
evaluationDependsOn(':dimlib')

loom {
    accessWidenerPath = file("src/main/resources/immersive_portals.classtweaker")

    mods {
        "immersive_portals" {
            sourceSet sourceSets.main
        }
        "dimlib" {
            sourceSet project(':dimlib').sourceSets.main
        }
    }
}

// --- Port quarantine -------------------------------------------------------------
// Sources that are not yet ported to 26.3 are excluded from compilation.
// Every entry must be listed in docs/26.3-port-progress.md and removed when the
// corresponding phase restores it.
def portQuarantine = [
    'qouteall/imm_ptl/core/compat/mixin/**',
    'qouteall/imm_ptl/core/compat/iris_compatibility/**',
    'qouteall/imm_ptl/core/compat/sodium_compatibility/**',
    // client rendering: redesigned for the 26.3 renderer in phases 5-6
    'qouteall/imm_ptl/core/render/**',
    'qouteall/imm_ptl/core/mixin/client/render/**',
    // GUI portal example: depends on GuiPortalRendering (restored with the renderer)
    'qouteall/imm_ptl/core/api/example/ExampleGuiPortalRendering.java',
    // per-dimension fog context swapping: part of FogRendererContext (restored with the renderer)
    'qouteall/imm_ptl/core/mixin/client/multiworld_awareness/MixinFogRenderer.java',
    // ducks implemented only by quarantined render mixins
    'qouteall/imm_ptl/core/ducks/IEGameRenderer.java',
    'qouteall/imm_ptl/core/ducks/IEShader.java',
    'qouteall/imm_ptl/core/ducks/IEWorldRenderer.java',
    // alternate dimension generators: worldgen was reworked in 26.3 (restored in phase 7)
    'qouteall/imm_ptl/peripheral/alternate_dimension/**',
    'qouteall/imm_ptl/peripheral/mixin/common/alternate_dimension/**',
    'qouteall/imm_ptl/peripheral/mixin/client/alternate_dimension/**',
]
// files inside quarantined directories that are already ported
def portQuarantineKeep = [
    'qouteall/imm_ptl/core/compat/iris_compatibility/IrisInterface.java',
    'qouteall/imm_ptl/core/compat/sodium_compatibility/SodiumInterface.java',
    // render state and math classes (no GPU calls) are ported first
    'qouteall/imm_ptl/core/render/context_management/RenderStates.java',
    'qouteall/imm_ptl/core/render/context_management/PortalRendering.java',
    'qouteall/imm_ptl/core/render/context_management/WorldRenderInfo.java',
    'qouteall/imm_ptl/core/render/context_management/StaticFieldsSwappingManager.java',
    'qouteall/imm_ptl/core/render/TransformationManager.java',
    'qouteall/imm_ptl/core/render/FrustumCuller.java',
    'qouteall/imm_ptl/core/render/renderer/PortalRenderer.java',
    'qouteall/imm_ptl/core/render/renderer/RendererDummy.java',
]
def portQuarantineMatchers = portQuarantine.collect {
    java.nio.file.FileSystems.getDefault().getPathMatcher("glob:" + it)
}

// minimal stand-ins for quarantined classes that the rest of the code still references;
// each stub file is deleted when the real class is restored
sourceSets.main.java.srcDir 'src/portstub/java'

sourceSets.main.java.exclude { FileTreeElement e ->
    if (e.directory) return false
    def path = e.relativePath.pathString
    if (portQuarantineKeep.contains(path)) return false
    def nioPath = java.nio.file.Paths.get(path)
    return portQuarantineMatchers.any { it.matches(nioPath) }
}
// ----------------------------------------------------------------------------------

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}") {
        exclude module: "fabric-gametest-api-v1"
        // for now, the gametest module makes client unable to login dev env server
    }

    api("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    api project(':dimlib')
    include project(':dimlib')

    compileOnly "${project.sodium_path}"
    compileOnly "${project.iris_path}"

    if (project.enable_sodium.equals('true')) {
        localRuntime "${project.sodium_path}"
    }

    if (project.enable_iris.equals('true')) {
        localRuntime "${project.iris_path}"
    }

    testImplementation(platform('org.junit:junit-bom:5.10.0'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

java {
    withSourcesJar()
}

jar {
    def fileName = "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}-fabric.jar"
    archiveFileName = fileName

    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// --- Game tests ----------------------------------------------------------------
// A separate test mod (src/gametest) run on Fabric's headless GameTest server:
//   ./gradlew runGametest
// The server loads a world with all mods and mixins, runs the tests and exits with a
// non-zero status on failure. Client tests (./gradlew runClientGametest) drive a real client. Nothing from this source set is packaged into the mod jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    // only on the game test classpath: the module changes login behaviour in normal dev runs
    gametestImplementation fabricApi.module("fabric-gametest-api-v1", project.fabric_version)
    gametestImplementation fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
}

loom {
    mods {
        "immersive_portals_gametest" {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gametest {
            server()
            name = "Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest/junit.xml').get().asFile}"
            runDir "build/gametest"
        }
        // real client with the renderer; creates a singleplayer world (no EULA involved):
        //   ./gradlew runClientGametest
        clientGametest {
            client()
            name = "Client Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric.client.gametest"
            runDir "build/clientgametest"
        }
    }
}

// local maven only; no remote repositories are configured on purpose
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
