# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G

org.gradle.parallel=false

# Mod Properties
# don't forget to change changelog.md after bumping version
mod_version=6.0.6
maven_group=qouteall
archives_base_name=immersive-portals

# Minecraft 26.3 is unobfuscated: no mappings, non-remapping Loom plugin
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.21

# Fabric API
fabric_version=0.161.0+26.3

modmenu_version=21.0.0
cloth_config_version=26.3.159
midnightlib_version=1.9.3+26.3-fabric
sodium_path=maven.modrinth:sodium:mc26.3-0.9.3-alpha.1-fabric
iris_path=maven.modrinth:iris:1.11.6+26.3-fabric

# dev-runtime switches for optional mods
enable_sodium=false
enable_iris=false

# DimLib subproject version (fork of iPortalTeam/DimLib 1.21.3 @ 467e83b5)
dimlib_mod_version=1.1.0-port.1

# don't forget to update this if branch changes
git_branch=26.3
